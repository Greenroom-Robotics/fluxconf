[workspace]
name      = "fluxconf"
channels  = ["az://stgrcondachannel.blob.core.windows.net/general", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
preview   = ["pixi-build"]

[dependencies]
fluxconf = { path = "." }

[package]
name = "fluxconf"
version     = "0.0.5"
description = "File-backed pydantic configuration with migration support"
license     = "MIT"
authors     = ["Greenroom Robotics <team@greenroomrobotics.com>"]

[package.build.backend]
name     = "pixi-build-python"
version  = ">=0.8,<0.9"
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]

[package.build.config]
noarch = true

[package.host-dependencies]
python    = "*"
hatchling = "*"

[package.run-dependencies]
python    = ">=3.10"
pydantic  = ">=2.0"
pyyaml    = ">=6.0"
jsonpatch = ">=1.33"
